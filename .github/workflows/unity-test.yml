name: Unity license test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: 6000.6.8f1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --global unity-license-activate

      - name: Activate
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_TOTP_KEY: ${{ secrets.UNITY_TOTP_KEY }}
        run: unity-license-activate "$UNITY_EMAIL" "$UNITY_PASSWORD" "${{ steps.alf.outputs.filePath }}" --authenticator-key "$UNITY_TOTP_KEY"

      - run: ls -la
